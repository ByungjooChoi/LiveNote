audio:
  buffer_size: 1024
  channels: 1
  sample_rate: 16000

output:
  auto_save: true
  filename_format: transcript_%Y%m%d_%H%M%S.txt
  save_directory: output

translation:
  language_from: en
  language_to: ko
  streaming: true

  # ==========================================================================
  # Model Selection
  # ==========================================================================
  # V2: Uses gemini-2.5-flash with streamGenerateContent API
  model: gemini-2.5-flash

  # ==========================================================================
  # Buffering Mode (for sequential interpretation)
  # ==========================================================================
  # When enabled, audio is buffered before sending to API.
  # This prevents audio loss but introduces delay.
  buffered_mode: true
  buffer_duration: 5.0  # seconds per buffer

  # ==========================================================================
  # Vertex AI Settings (only needed for s2st mode)
  # ==========================================================================
  use_vertex_ai: false
  vertex_project: "elastic-sa"
  vertex_location: "us-central1"
